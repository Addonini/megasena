name: Robô da Mega-Sena

on:
  schedule:
    # 00:30 UTC = 21:30 BRT. Roda Qua (3), Sex (5) e Dom (0)
    - cron: '30 0 * * 3,5,0'
  workflow_dispatch: # Adiciona um botão para você rodar manualmente quando quiser!

jobs:
  atualizar_banco:
    runs-on: ubuntu-latest
    
    steps:
      - name: Pegar os arquivos do projeto
        uses: actions/checkout@v4
        
      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar as bibliotecas
        run: pip install -r requirements.txt
        
      - name: Rodar o Atualizador!
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python atualizador.py
