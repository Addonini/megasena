name: Robô da Mega-Sena

on:
  schedule:
    # Roda às 00:30 UTC (21:30 no Brasil) nos dias de sorteio da Mega-Sena (Domingo, Quarta e Sexta em UTC = Terça, Quinta e Sábado no Brasil)
    - cron: '30 0 * * 0,3,5'
  workflow_dispatch:

jobs:
  atualizar_banco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      
      - name: Rodar o Atualizador da Mega-Sena
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python atualizador_megasena.py

      # 👇 BLOCO PARA ACORDAR A TELA DA MEGA-SENA (BEM ALINHADO!) 👇
      - name: Manter Streamlit da Mega-Sena Acordado
        run: curl -s "https://megasenadon.streamlit.app" > /dev/null
