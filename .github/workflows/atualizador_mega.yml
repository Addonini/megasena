name: Robô da Mega-Sena

on:
  schedule:
    # Roda toda Quarta e Sábado às 23:30 (UTC) -> 20:30 no Horário de Brasília
    - cron: '30 23 * * 3,6'
  workflow_dispatch: # Adiciona um botão para você rodar manualmente quando quiser!

jobs:
  atualizar_banco:
    runs-on: ubuntu-latest
    
    steps:
      - name: Pegar os arquivos do projeto
        uses: actions/checkout@v3
        
      - name: Instalar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalar as bibliotecas
        run: pip install -r requirements.txt
        
      - name: Rodar o Atualizador!
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python atualizador.py
